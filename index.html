<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주간 영업회의 회의록 — GRACE INC.</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e2d42;
    --body: #3d4a5c;
    --muted: #88919f;
    --accent: #384967;
    --accent-light: #5a7290;
    --accent-bg: #eef1f5;
    --surface: #ffffff;
    --bg: #f7f8fa;
    --border: #e2e5eb;
    --gold: #c4a35a;
    --hover-bg: #f0f2f7;
    --current-glow: rgba(56, 73, 103, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── HEADER ─── */
  .site-header {
    background: linear-gradient(135deg, #2c3e54 0%, #384967 40%, #7b8fa8 100%);
    position: relative;
    overflow: hidden;
  }

  .site-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 50%, rgba(196, 163, 90, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(123, 143, 168, 0.25) 0%, transparent 40%);
    pointer-events: none;
  }

  .header-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 48px 32px 44px;
    position: relative;
    z-index: 1;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .brand-logo {
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    letter-spacing: -0.5px;
    backdrop-filter: blur(8px);
  }

  .brand-text {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }

  .page-subtitle {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
    font-weight: 300;
    letter-spacing: 0.3px;
  }

  .header-divider {
    width: 48px;
    height: 2px;
    background: var(--gold);
    margin: 18px 0 12px;
    opacity: 0.7;
  }

  /* ─── MAIN ─── */
  .main-content {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 32px 80px;
  }

  /* ─── CURRENT CARD ─── */
  .current-section {
    margin-top: -28px;
    position: relative;
    z-index: 2;
  }

  .current-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 28px;
    box-shadow: 0 4px 24px rgba(26, 26, 46, 0.06), 0 1px 3px rgba(26, 26, 46, 0.04);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    transition: box-shadow 0.25s ease;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }

  .current-card:hover {
    box-shadow: 0 8px 32px rgba(42, 68, 148, 0.1), 0 2px 6px rgba(26, 26, 46, 0.05);
  }

  .current-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .current-label .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .current-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .current-date {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .current-arrow {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s, transform 0.2s;
  }

  .current-card:hover .current-arrow {
    background: var(--accent);
    transform: translateX(3px);
  }

  .current-card:hover .current-arrow svg {
    stroke: #fff;
  }

  .current-arrow svg {
    width: 18px;
    height: 18px;
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
    transition: stroke 0.2s;
  }

  /* ─── ARCHIVE LIST ─── */
  .archive-section {
    margin-top: 48px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
  }

  .year-group {
    margin-top: 28px;
  }

  .year-label {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    padding-left: 4px;
  }

  .minutes-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(26, 26, 46, 0.03);
  }

  .minutes-item {
    display: flex;
    align-items: center;
    padding: 14px 24px;
    text-decoration: none;
    color: inherit;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
    gap: 16px;
  }

  .minutes-item:last-child {
    border-bottom: none;
  }

  .minutes-item:hover {
    background: var(--hover-bg);
  }

  .item-date-badge {
    width: 52px;
    height: 52px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s;
  }

  .minutes-item:hover .item-date-badge {
    border-color: var(--accent);
    background: var(--accent-bg);
  }

  .item-month {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1;
  }

  .item-day {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.2;
  }

  .item-info {
    flex: 1;
    min-width: 0;
  }

  .item-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .item-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .item-weekday {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .item-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s, transform 0.2s;
  }

  .minutes-item:hover .item-icon {
    opacity: 1;
    transform: translateX(0);
  }

  .item-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--accent);
    stroke-width: 2;
    fill: none;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
    font-size: 14px;
  }

  /* ─── FOOTER ─── */
  .site-footer {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 32px 48px;
    text-align: center;
  }

  .footer-line {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 24px;
  }

  .footer-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }

  .footer-text a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ─── SEARCH ─── */
  .search-bar {
    margin-top: 32px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar input::placeholder {
    color: var(--muted);
  }

  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--current-glow);
  }

  .search-bar .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    .header-inner { padding: 36px 20px 36px; }
    .page-title { font-size: 28px; }
    .main-content { padding: 0 16px 60px; }
    .current-card { padding: 18px 20px; }
    .minutes-item { padding: 12px 16px; }
    .item-date-badge { width: 44px; height: 44px; }
    .item-day { font-size: 17px; }
    .item-month { font-size: 9px; }
  }

  /* ─── ANIMATION ─── */
  .fade-in {
    opacity: 0;
    transform: translateY(12px);
    animation: fadeUp 0.5s ease forwards;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .minutes-item {
    opacity: 0;
    animation: fadeUp 0.35s ease forwards;
  }
</style>
</head>

/* ───── 이하 렌더링 로직 (수정 불필요) ───── */

const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const FOLDER_SVG = '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

function parse(m) {
  const [y, mo, d] = m.date.split('-').map(Number);
  return { ...m, year: y, month: mo, day: d, dayStr: String(d).padStart(2, '0'), monthEn: MONTHS_EN[mo - 1] };
}

function render() {
  const data = minutes.map(parse).sort((a, b) => b.date.localeCompare(a.date));

  // 1) 최신 회의록 카드
  const latest = data[0];
  const cs = document.getElementById('currentSection');
  if (latest) {
    cs.innerHTML =
      '<a class="current-card" href="' + latest.url + '" target="_blank" rel="noopener">' +
        '<div>' +
          '<div class="current-label"><span class="dot"></span>최신 회의록</div>' +
          '<div class="current-title">' + latest.title + '</div>' +
          '<div class="current-date">' + latest.year + '년 ' + latest.month + '월 ' + latest.day + '일 (' + latest.weekday + ')</div>' +
        '</div>' +
        '<div class="current-arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>' +
      '</a>';
  }

  // 2) 연도별 그룹핑
  const byYear = {};
  data.forEach(m => { (byYear[m.year] = byYear[m.year] || []).push(m); });
  const years = Object.keys(byYear).sort((a, b) => b - a);

  const container = document.getElementById('archiveContainer');
  let delay = 0.05;
  container.innerHTML = years.map(year => {
    const items = byYear[year].map(m => {
      const search = [m.year, m.dayStr, m.month, m.month + '월', m.weekday, m.title].join(' ');
      const html =
        '<a class="minutes-item" href="' + m.url + '" target="_blank" rel="noopener" data-search="' + search + '" style="animation-delay:' + delay.toFixed(2) + 's">' +
          '<div class="item-date-badge"><span class="item-month">' + m.monthEn + '</span><span class="item-day">' + m.dayStr + '</span></div>' +
          '<div class="item-info"><div class="item-title">' + m.title + '</div><div class="item-meta"><span class="item-weekday">' + m.weekday + '요일</span><span>·</span><span>' + m.year + '.' + String(m.month).padStart(2,'0') + '.' + m.dayStr + '</span></div></div>' +
          '<div class="item-icon">' + FOLDER_SVG + '</div>' +
        '</a>';
      delay += 0.03;
      return html;
    }).join('');
    return '<div class="year-group" data-year="' + year + '"><div class="year-label">' + year + '</div><div class="minutes-list">' + items + '</div></div>';
  }).join('');

  // 3) 카운트
  document.getElementById('countLabel').textContent = '총 ' + data.length + '건';
}

function filterList(query) {
  const q = query.toLowerCase().trim();
  const items = document.querySelectorAll('.minutes-item');
  const yearGroups = document.querySelectorAll('.year-group');
  let visibleCount = 0;

  items.forEach(item => {
    const searchData = (item.getAttribute('data-search') || '').toLowerCase();
    const titleEl = item.querySelector('.item-title');
    const title = titleEl ? titleEl.textContent.toLowerCase() : '';
    const match = !q || searchData.includes(q) || title.includes(q);
    item.style.display = match ? '' : 'none';
    if (match) visibleCount++;
  });

  yearGroups.forEach(group => {
    const visibleItems = group.querySelectorAll('.minutes-item:not([style*="display: none"])');
    group.style.display = visibleItems.length > 0 ? '' : 'none';
  });

  document.getElementById('countLabel').textContent = q ? visibleCount + '건 검색됨' : '총 ' + minutes.length + '건';
}

render();
</script>
